<!DOCTYPE html>
<html lang="en">

<!--Manifesto Project
Title - born not created
Manifesto Mxcerpt - Sōri Yanagi: Ten Principles of Design
By - Lucas Hamner -->

<head>
    <meta charset="utf-8">
    <!--adding typewriter like font ((free google font))-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

    <title>True beauty is born, not created.</title>
    <style> 
        body {
        font-family: "Special Elite","Courier New",monospace;
        background-color: rgb(245, 242, 243);
        color: rgb(219, 1, 1);
        }
        h1 {
            color: #700000;
            font-weight: bold;
            font-size: 220px;
            letter-spacing: 50px;
            /* negative margins decrease space between lines */
            margin-top: 100px;
            margin-bottom: -80px;
            margin-right: 500px;
            text-align:center;
        }
        div {
            font-weight: bold;
            font-size: 60px;
            transform: rotate(2deg);
        }
        .offset {
            /* Increases left margin to move elements to the right*/
            margin-left: 450px;
        }
        .offset > span {
            display:inline-block;
            transform: rotate(-10deg);
        }
        .highlight {
            font-weight: bold;
            font-size: 100px;
            color: white
        }
        .page-title {
            text-align: center;
            font-size: 28px;
            padding-top: 30px;
            font-family: Arial, sans-serif;
            color: white;
        }
        .side-text {
            position: absolute;
            top: 250px;
            right: 80px;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            font-size: 48px;
        }
        .curve span {
            display: inline-block;

        }
        .c1 { transform: translateY(6px); }
        .c2 { transform: translateY(3px); }
        .c3 { transform: translateY(0px); }

        .big-curve span {
            display: inline-block;
        }
        .bc1 { transform: translateY(80px); }
        .bc2 { transform: translateY(9px); }
        .bc3 { transform: translateY(-80px); }
    </style>

</head>

<body>
    <div class="page-title">born not created</div>

    <div class="side-text">
        True
        <span class="curve">
            <span class="c1">b</span><span class="c2">e</span><span class="c3">a</span><span class="c3">u</span><span class="c2">t</span><span class="c1">y</span>
        </span>
    </div>

    <h1 class="offset">
        True
        <!--curved "beauty" inside the primary headline-->
        <span class="big-curve">
        <span class="bc1">b</span><span class="bc2">e</span><span class="bc3">a</span><span class="bc3">u</span><span class="bc2">t</span><span class="bc1">y</span>
        </span>
            is born <span class="highlight">not</span> <span style="transform:rotate(15deg);">crea</span>ted.
    </h1>

<script>
    console.log("Hello, from me. :)");
</script>
</body>
</html>
