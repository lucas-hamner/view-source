<!DOCTYPE html>
<html lang="en">

<!---Comment Test!!-->

<head>
    <meta charset="utf-8">
    <!--adding typewriter like font ((free google font))-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

    <title>True beauty is born, not created.</title>
    <style> 
        body {
        font-family: "Special Elite","Courier New",monospace;
        background-color: rgb(12, 2, 4);
        color: rgb(219, 52, 1);
        }
        h1 {
            color: #ff6d0b;
            font-weight: bold;
            font-size: 220px;
            letter-spacing: 12px;
            /* negative margins decrease space between lines */
            margin-top: 150px;
            margin-bottom: -80px;
            margin-right: 500px;
            text-align:center;
        }
        div {
            font-weight: bold;
            font-size: 60px;
            transform: rotate(2deg);
        }
        .offset {
            /* Increases left margin to move elements to the right*/
            margin-left: 450px;
        }
        .offset span {
            display:inline-block;
            transform: rotate(-10deg);
        }
        .highlight {
            font-weight: bold;
            font-size: 100px;
            color: white
        }
    </style>

</head>

<body>

     <h1 class="offset">
        True<span>beauty is</span>born <span class="highlight">not</span> <span style="transform:rotate(15deg);">crea</span>ted.
    </h1>

<script>
    console.log("Hello, from me. :)");
</script>
</body>
</html>
